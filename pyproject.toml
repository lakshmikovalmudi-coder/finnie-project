[project]
name = "finnie"
version = "0.1.0"
description = "Multi-agent AI finance tutor (LangGraph + Streamlit)"
requires-python = ">=3.11,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: hits real OpenAI / market / news APIs (run with: pytest -m live -s)"]
